<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>java-console</title>
  </head>
  <body>
    <script>
      // Basic
      // positive or negative integars take a number from the user and check whether it is positive or negative
      let number = Number(prompt("Enter a number:"));

      if (number > 0) {
        console.log("Positive");
      } else if (number < 0) {
        console.log("Negative");
      } else {
        console.log("Zero");
      }

      //   Even or Odd numbers
      let number1 = Number(prompt("Enter a number:"));

      if (number1 % 2 === 0) {
        console.log("Even");
      } else {
        console.log("Odd");
      }

      //   Voting Eligibility
      let age = Number(prompt("Enter your age:"));

      if (age >= 18) {
        console.log("You can vote");
      } else {
        console.log("You cannot vote");
      }

      //   Intermediate
      // Grade Calculator
      let marks = Number(prompt("Enter your marks:"));

      if (marks >= 90 && marks <= 100) {
        console.log("A+");
      } else if (marks >= 80 && marks <= 89) {
        console.log("A");
      } else if (marks >= 70 && marks <= 79) {
        console.log("B");
      } else if (marks >= 60 && marks <= 69) {
        console.log("C");
      } else if (marks < 60 && marks >= 0) {
        console.log("Fail");
      } else {
        console.log("Invalid marks");
      }

      //   largest of two numbers

      let number2 = Number(prompt("Enter first number:"));
      let number3 = Number(prompt("Enter second number:"));

      if (number2 > number3) {
        console.log(number2 + " is larger");
      } else if (number3 > number2) {
        console.log(number3 + " is larger");
      } else {
        console.log("Both numbers are equal");
      }

      //   temperature Checker
      let temperature = Number(prompt("Enter temperature:"));

      if (temperature > 40) {
        console.log("Very Hot");
      } else if (temperature >= 30) {
        console.log("Hot");
      } else if (temperature >= 20) {
        console.log("Normal");
      } else {
        console.log("Cold");
      }
      //   Advance
      // login system

      let username = prompt("Enter username:");
      let password = prompt("Enter password:");

      let correctUsername = "admin";
      let correctPassword = "12345";

      if (username === correctUsername) {
        if (password === correctPassword) {
          console.log("Login successful");
        } else {
          console.log("Wrong password");
        }
      } else {
        console.log("Wrong username");
      }

      //   student admission checker
      let age1 = Number(prompt("Enter your age:"));
      let marks1 = Number(prompt("Enter your marks:"));
      let interview = prompt("Enter interview result (pass/fail):");

      if (age1 >= 18 && marks1 >= 60) {
        if (interview === "pass") {
          console.log("Admission approved");
        } else {
          console.log("Admission rejected: Interview failed");
        }
      } else {
        console.log("Admission rejected: Age or marks requirement not met");
      }

      //   challenging
      // Atm withdrawl system
      let balance = Number(prompt("Enter account balance:"));
      let withdrawal = Number(prompt("Enter withdrawal amount:"));
      let pin = Number(prompt("Enter your PIN:"));

      let correctPin = 1234;

      if (pin === correctPin) {
        if (withdrawal > 0) {
          if (withdrawal <= balance) {
            balance = balance - withdrawal;

            console.log("Withdrawal successful");
            console.log("Remaining balance: " + balance);
          } else {
            console.log("Insufficient balance");
          }
        } else {
          console.log("Withdrawal amount must be greater than 0");
        }
      } else {
        console.log("Incorrect PIN");
      }

      let amount = Number(prompt("Enter total shopping amount:"));
      let membership = prompt("Are you a member? (yes/no)");

      let discount = 0;

      if (amount >= 10000) {
        discount = 20;
      } else if (amount >= 5000) {
        discount = 10;
      } else if (amount >= 2000) {
        discount = 5;
      } else {
        discount = 0;
      }

      if (membership === "yes") {
        discount = discount + 5;
      }

      let discountAmount = (amount * discount) / 100;
      let finalAmount = amount - discountAmount;

      console.log("Original Amount: " + amount);
      console.log("Discount: " + discount + "%");
      console.log("Discount Amount: " + discountAmount);
      console.log("Final Amount: " + finalAmount);
    </script>
  </body>
</html>
